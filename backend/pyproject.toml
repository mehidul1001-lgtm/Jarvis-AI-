[project]
name = "jarvis-backend"
version = "0.1.0"
description = "JARVIS AI enterprise business assistant - backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    "S101",  # assert is expected in tests and internal invariants
    "B008",  # FastAPI Depends/Query in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
# conftest must set environment variables before importing the app.
"tests/conftest.py" = ["E402"]
# Hardcoded test credentials are fixtures, not secrets.
"tests/*" = ["S105", "S106"]
# Autogenerated migrations keep Alembic's own layout.
"alembic/versions/*" = ["E501", "W291"]
